name: Verify exact adapter source symbols
on:
  push:
    branches: [graphics/adapter-symbols]
    paths: ['.github/workflows/adapter-symbols.yml', 'tools/adapter-source-builds.json']
permissions:
  contents: read
jobs:
  frlgplus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libpng-dev python3 git
      - name: Build pinned source and verify exact user revision
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib
          row=json.loads(pathlib.Path('tools/adapter-source-builds.json').read_text())['frlgplus']
          def run(*args,cwd=None): subprocess.run(args,cwd=cwd,check=True)
          run('git','init','build/source')
          run('git','-C','build/source','fetch','--depth','1',row['repository'],row['commit'])
          run('git','-C','build/source','checkout','--detach','FETCH_HEAD')
          # The tag references this directory with Windows casing. Resolve only
          # the proven case alias; retain every source file and exact ROM gate.
          tiles=pathlib.Path('build/source/data/tilesets/secondary')
          assert (tiles/'seviiislands5/anim/mossdeep_tree_base/0.png').is_file()
          assert not (tiles/'SeviiIslands5').exists()
          (tiles/'SeviiIslands5').symlink_to('seviiislands5',target_is_directory=True)
          run('git','init','build/agbcc')
          run('git','-C','build/agbcc','fetch','--depth','1','https://github.com/pret/agbcc.git','da598c1d918402c42c0c0d7128ba14567f3175e9')
          run('git','-C','build/agbcc','checkout','--detach','FETCH_HEAD')
          run('./build.sh',cwd='build/agbcc')
          run('./install.sh','../source',cwd='build/agbcc')
          run('make','-C','build/source','-j4')
          rom=pathlib.Path('build/source')/row['rom']
          actual=hashlib.sha256(rom.read_bytes()).hexdigest()
          pathlib.Path('symbol-output').mkdir()
          pathlib.Path('symbol-output/provenance.json').write_text(json.dumps(dict(row,built_sha256=actual,exact_revision_match=actual==row['sha256'],source_path_alias='SeviiIslands5 -> seviiislands5'),indent=2))
          with open('symbol-output/symbols.txt','w') as out:
              subprocess.run(['arm-none-eabi-nm','-S','--defined-only',str(rom.with_suffix('.elf'))],stdout=out,check=True)
          data=rom.read_bytes();ranges=[]
          for line in pathlib.Path('symbol-output/symbols.txt').read_text().splitlines():
              parts=line.split()
              if len(parts)!=4: continue
              address,size=int(parts[0],16),int(parts[1],16)
              if size and 0x08000000<=address and address+size<=0x08000000+len(data):
                  ranges.append(dict(address=address,size=size,type=parts[2],name=parts[3],sha256=hashlib.sha256(data[address-0x08000000:address-0x08000000+size]).hexdigest()))
          pathlib.Path('symbol-output/range-hashes.json').write_text(json.dumps(ranges))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frlgplus-source-symbols-diagnostic
          path: symbol-output/
          if-no-files-found: error
      - name: Require exact revision before treating symbols as authoritative
        run: |
          python3 - <<'PY'
          import json,pathlib
          row=json.loads(pathlib.Path('symbol-output/provenance.json').read_text())
          assert row['exact_revision_match'],f"Exact revision mismatch: {row['built_sha256']}; diagnostic hashes only, no adapter approval"
          PY
