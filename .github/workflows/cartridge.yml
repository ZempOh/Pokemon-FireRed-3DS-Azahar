name: Build browser cartridge engine

on:
  push:
    branches: [standalone-browser-output, thor-rendering-tuning, graphics/azahar-firered]
    paths: ['.github/workflows/cartridge.yml', '3ds_port/**', 'patches/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential curl git libpng-dev python3 python3-pil unzip
          curl -fsSL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -o /tmp/makerom.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          find /tmp/makerom -type f -name makerom -exec install -m 755 {} /usr/local/bin/makerom \;
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
      - name: Compile the engine without game data
        run: |
          python3 tools/bootstrap.py --dir build/upstream
          make -C build/upstream -j2 tools
          make -C build/upstream -j2 generated
          make -C build/upstream/3ds_port -j2 PYTHON=python3 cartridge-template
      - uses: actions/upload-artifact@v4
        with:
          name: cartridge-engine
          path: build/upstream/3ds_port/dist/cartridge-template.3ds
          if-no-files-found: error
      - name: Generate matching ROM extraction recipe
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git /tmp/agbcc
          git clone https://github.com/pret/pokefirered.git /tmp/stock
          git -C /tmp/stock checkout 037335f4c725d7c9aecdac87066f2002b4bd7e14
          (cd /tmp/agbcc && ./build.sh && ./install.sh /tmp/stock)
          make -C /tmp/stock -j2 compare_firered_rev1
          python3 tools/build_release.py --version 0.5.1 --python-builder --tree build/upstream \
            --rom /tmp/stock/pokefirered_rev1.gba --nm "$DEVKITARM/bin/arm-none-eabi-nm"
          cp build/upstream/3ds_port/dist/cartridge-template.3ds dist/cartridge-template.3ds
      - uses: actions/upload-artifact@v4
        with:
          name: cartridge-engine-and-recipe
          path: |
            dist/cartridge-template.3ds
            dist/FireRed3DS-v0.5.1-Windows.zip
          if-no-files-found: error
