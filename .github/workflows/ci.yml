name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publication audit
        run: python tools/release_audit.py --repo . --strict
      - name: Byte-compile all Python
        run: python -m compileall -q builder tools 3ds_port/scripts 3ds_port/tests
      - name: Builder tests (synthetic data, no ROM)
        run: python -m unittest discover -s builder/tests -v
      - name: Three-layer scenery art composition
        run: python 3ds_port/tests/voxel_building_layers_test.py
      - name: Presentation clock and real-stall regression
        run: |
          cc -std=c99 -Wall -Wextra -Werror -I3ds_port/src 3ds_port/tests/frame_rate_test.c -o /tmp/frame-rate-test
          /tmp/frame-rate-test
      - name: Synthetic web payload passes the release contract audit
        run: |
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data pack parser against the builder's writer
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -I3ds_port/include \
              3ds_port/tests/pak_test.c 3ds_port/src/3ds_pak.c -o pak_test
          ./pak_test test.pak "$(python 3ds_port/tests/make_test_pak.py test.pak)"
      - name: Input and video decoding
        run: |
          cd 3ds_port
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/input_test.c src/3ds_input_decode.c -o input_test && ./input_test
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/video_decode_test.c src/3ds_video_decode.c -o video_test && ./video_test
      - name: Full live-boulder buffer regression
        run: python3 3ds_port/tests/solid_boulder_test.py
      - name: Day/night clock and lighting
        run: make -C 3ds_port verify-daynight verify-clock-store verify-encounters verify-night-lamps
      - name: Standalone voxel shadows and mesh fixtures
        run: |
          make -C 3ds_port verify-voxel-lighting verify-voxel-trees build/voxel_ground_mesh_test.exe
          cd 3ds_port
          ./build/voxel_ground_mesh_test.exe
      - name: Night window masks and building-page compatibility
        run: |
          python -m pip install Pillow
          python 3ds_port/tests/voxel_night_test.py --cc gcc
      - name: Bottom map and clock footer
        run: python 3ds_port/tests/bottom_map_test.py

  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential g++ libpng-dev python3 python3-pil git
      - name: Bootstrap and build
        run: |
          python3 -m py_compile tools/port_common/gen_asset_table.py
          python3 builder/tests/test_asset_table_compatibility.py
          python3 tools/bootstrap.py
          python3 3ds_port/tests/classic_battle_split_icon_test.py --tree build/upstream --cc gcc
          python3 3ds_port/tests/classic_tileset_animation_test.py --tree build/upstream --cc gcc
          make -C build/upstream -j4 tools
          make -C build/upstream -j4 generated
          make -C build/upstream/3ds_port -kj4 PYTHON=python3
      - name: Winter ground atlas and material regression
        run: |
          cd build/upstream/3ds_port
          gcc -std=gnu99 -O2 -DPORTABLE -DMODERN=1 -D__INTELLISENSE__ -iquote compat -iquote ../include -iquote ../gflib -Iinclude -Isrc/voxel tests/voxel_atlas_test.c src/voxel/voxel_grade.c -o /tmp/winter-atlas
          /tmp/winter-atlas
          gcc -std=c99 -Wall -Wextra -Werror -Isrc/voxel tests/voxel_winter_test.c -o /tmp/winter-material
          /tmp/winter-material
      - name: Engine-only 3DSX
        run: make -C build/upstream/3ds_port release PYTHON=python3
      - name: Audit the build outputs that would ship
        run: |
          mkdir -p ship && cp build/upstream/3ds_port/dist/Emerald3DS.3dsx build/upstream/3ds_port/dist/Emerald3DS.smdh ship/
          # In payload/, where the release ships them (release_audit_allow.toml [large]).
          python3 -c "import zipfile,pathlib; z=zipfile.ZipFile('ship.zip','w'); [z.write(p, 'payload/' + p.name) for p in pathlib.Path('ship').iterdir()]"
          python3 tools/release_audit.py --zip ship.zip --strict
      - uses: actions/upload-artifact@v4
        with:
          name: pokeclassic-voxel-engine
          path: ship/
      - name: Export runtime symbol addresses
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[classic-recipe]')
        run: |
          port=build/upstream/3ds_port
          elf="$port/build/emerald3ds_3dsx.elf"
          mkdir -p native-symbols
          "$DEVKITARM/bin/arm-none-eabi-nm" -n -S --defined-only "$elf" > native-symbols/symbols.txt
          "$DEVKITARM/bin/arm-none-eabi-readelf" -W -S "$elf" > native-symbols/sections.txt
          printf '%s\n' "$GITHUB_SHA" > native-symbols/commit.txt
          (cd "$port/dist" && sha256sum Emerald3DS.3dsx) > native-symbols/engine.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[classic-recipe]')
        with:
          name: pokeclassic-voxel-native-symbols
          path: native-symbols/
          if-no-files-found: error
      - name: Host tests and link audit
        run: make -C build/upstream/3ds_port verify PYTHON=python3

  builder-recipe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[classic-recipe]')
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libpng-dev python3 python3-pil git
      - name: Build the pinned Classic source and verify ROM identity
        run: |
          git init build/stock
          git -C build/stock fetch --depth 1 https://github.com/DaniRainbow/pokeclassic.git 02be0b670d9548b3d12c769faa051853df7fe19d
          git -C build/stock checkout --detach FETCH_HEAD
          git init build/agbcc
          git -C build/agbcc fetch --depth 1 https://github.com/pret/agbcc.git da598c1d918402c42c0c0d7128ba14567f3175e9
          git -C build/agbcc checkout --detach FETCH_HEAD
          (cd build/agbcc && ./build.sh && ./install.sh ../stock)
          make -C build/stock -j4
          echo '7e27a7878d6aeb3b798757f98e60d1064d762dbb  build/stock/pokeClassic.gba' | sha1sum -c
      - name: Export GBA symbols for companion profile validation
        run: |
          "$DEVKITARM/bin/arm-none-eabi-nm" -S --defined-only build/stock/pokeClassic.elf > classic-gba-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokeclassic-gba-symbols
          path: classic-gba-symbols.txt
          if-no-files-found: error
      - name: Rebuild native staging
        run: |
          python3 tools/bootstrap.py
          python3 3ds_port/tests/classic_battle_split_icon_test.py --tree build/upstream
          python3 3ds_port/tests/classic_tileset_animation_test.py --tree build/upstream
          make -C build/upstream -j4 tools
          make -C build/upstream -j4 generated
          make -C build/upstream/3ds_port -j4 PYTHON=python3
      - name: Write the extraction recipe
        run: |
          port=build/upstream/3ds_port
          mkdir -p ship/payload
          python3 -u tools/gen_recipe.py --decomp build/upstream --romfs "$port/romfs" \
            --rom build/stock/pokeClassic.gba --gba-elf build/stock/pokeClassic.elf \
            --out ship/payload/emerald3ds.recipe --release v0.5.0 \
            --elf "$port/emerald3ds.elf" --image-elf "$port/build/gamedata_image.elf" \
            --image-map "$port/build/gamedata_image.map" --nm "$DEVKITARM/bin/arm-none-eabi-nm"
      - name: Stage the generator sources and verify the rebuilt pack
        run: |
          PYTHONPATH=tools:builder python3 -u - <<'PY'
          from pathlib import Path
          from emerald3ds_builder.build import Payload, build_pack
          from voxel_precompile import stage_voxelgen
          payload = Path("ship/payload").resolve()
          stage_voxelgen(Path("3ds_port"), payload / "voxelgen")
          info = build_pack(Path("build/stock/pokeClassic.gba"), Payload(payload),
                            Path("build/classic-verify.pak"),
                            lambda fraction, message: print(f"{fraction:.0%} {message}"),
                            follower_fetcher=False)
          print(f"Verified Classic pack with {info['entries']} entries")
          PY
      - name: Audit the recipe before uploading
        run: |
          python3 -c "from shutil import make_archive; make_archive('recipe', 'zip', 'ship')"
          python3 tools/release_audit.py --zip recipe.zip --strict --rom build/stock/pokeClassic.gba
      - uses: actions/upload-artifact@v4
        with:
          name: pokeclassic-voxel-recipe
          path: ship/payload/
          if-no-files-found: error
