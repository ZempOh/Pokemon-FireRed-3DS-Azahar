name: Compile FRLG Plus native port

on:
  push:
    branches: [voxel-frlg-plus, graphics/azahar-frlg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y build-essential curl git libpng-dev python3 python3-pil unzip
          curl -fsSL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -o /tmp/makerom.zip
          unzip -q /tmp/makerom.zip -d /tmp/makerom
          find /tmp/makerom -type f -name makerom -exec install -m 755 {} /usr/local/bin/makerom \;
      - name: Prepare FRLG Plus source
        run: |
          python3 tools/bootstrap.py --dir build/upstream
          make -C build/upstream -j2 tools
          make -C build/upstream -j2 generated
      - name: Compile native cartridge template
        run: make -C build/upstream/3ds_port -kj2 PYTHON=python3 cartridge-template
      - uses: actions/upload-artifact@v4
        with:
          name: frlg-plus-cartridge-template
          path: build/upstream/3ds_port/dist/cartridge-template.3ds
          if-no-files-found: error
      - name: Reproduce the official FRLG Plus ROM for recipe generation
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git /tmp/agbcc
          git init /tmp/stock
          git -C /tmp/stock fetch --depth 1 https://github.com/pret/pokefirered.git 037335f4c725d7c9aecdac87066f2002b4bd7e14
          git -C /tmp/stock checkout --detach FETCH_HEAD
          (cd /tmp/agbcc && ./build.sh && ./install.sh /tmp/stock)
          make -C /tmp/stock -j2 compare_firered
          git init /tmp/flips
          git -C /tmp/flips fetch --depth 1 https://github.com/Alcaro/Flips.git ff216a75df0987047a67d7923567dc4482ce07ac
          git -C /tmp/flips checkout --detach FETCH_HEAD
          make -C /tmp/flips TARGET=cli
          curl -fsSL https://github.com/Deokishisu/FRLG-Plus/releases/download/v1.5.1/frlgPlus.bps -o /tmp/frlgPlus.bps
          echo '1f35d2ec9acc94b12d86055dccf3bb03a8593622d9eabf7f9dd538d87fe38d53  /tmp/frlgPlus.bps' | sha256sum -c
          /tmp/flips/flips --apply /tmp/frlgPlus.bps /tmp/stock/pokefirered.gba /tmp/frlg-plus.gba
          echo 'c34a4401f2fe86c515fc6d9a6d231224a98f55d5  /tmp/frlg-plus.gba' | sha1sum -c
      - name: Generate matching local-builder recipe
        run: |
          python3 tools/build_release.py --version 1.5.1 --cartridge-recipe-only --tree build/upstream \
            --rom /tmp/frlg-plus.gba --nm "$DEVKITARM/bin/arm-none-eabi-nm"
      - uses: actions/upload-artifact@v4
        with:
          name: frlg-plus-cartridge-recipe
          path: dist/FireRed3DS-v1.5.1-Windows.zip
          if-no-files-found: error
