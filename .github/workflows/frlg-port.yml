name: Compile FRLG Plus native port

on:
  push:
    branches: [voxel-frlg-plus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: apt-get update && apt-get install -y build-essential git libpng-dev python3 python3-pil
      - name: Prepare FRLG Plus source
        run: |
          python3 tools/bootstrap.py --dir build/upstream
          make -C build/upstream -j2 tools generated
      - name: Compile game code and link native executable
        run: make -C build/upstream/3ds_port -kj2 PYTHON=python3 release
