name: Scenery pipeline regression
on:
  push:
    branches: [graphics/pokedaisy-upgrade]
    paths: ['tools/scenery_pipeline.py', 'tools/scenery_profiles.json', 'tools/tests/test_scenery_pipeline.py', 'tools/scenery-geometry/**', 'tools/scenery-recipes/**', '.github/workflows/scenery-pipeline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/tests/test_scenery_pipeline.py
      - name: Closed botanical geometry
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror tools/scenery-geometry/test_botanical.c -lm -o /tmp/botanical-test
          /tmp/botanical-test
