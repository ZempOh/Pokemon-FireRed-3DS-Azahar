<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build voxel Pokémon cartridges for Azahar using your own ROM files.">
  <title>Voxel game builder · Pokémon 3DS</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="assets/css/site.css?v=3">
  <link rel="stylesheet" href="assets/css/voxel.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./"><img src="img/icon.png" alt="">FireRed 3DS</a>
      <nav class="voxel-nav" aria-label="Main navigation">
        <a href="build.html">FireRed builder</a>
        <a href="https://github.com/ZempOh/Pokemon-FireRed-3DS-Azahar">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap voxel-main">
    <h1>Voxel game builder</h1>
    <p class="lead">Build a voxel 3D game for Azahar. Your ROM stays on this device.</p>
    <div class="voxel-layout">
      <section aria-labelledby="ports-title">
        <h2 id="ports-title">Choose a game</h2>
        <div class="voxel-games" data-games></div>
      </section>
      <section class="panel voxel-panel" aria-labelledby="build-title">
        <h2 id="build-title">Build a game</h2>
        <p data-rom-help>Select a game to see the required ROM version.</p>
        <form data-form>
          <label class="drop" data-drop>
            <strong>Choose or drop your ROM here</strong>
            <span class="small muted">.gba, .agb, .bin, or a .zip with one ROM</span>
            <input aria-label="Choose a ROM file" type="file" accept=".gba,.agb,.bin,.zip" data-rom disabled>
          </label>
          <p data-file class="small" hidden></p>
          <p data-status class="small" role="status" aria-live="polite"></p>
          <progress aria-label="Build progress" max="1" value="0" hidden data-progress></progress>
          <div class="actions voxel-actions">
            <button class="btn btn-primary" type="submit" data-build disabled>Build .3ds cartridge</button>
            <button class="btn btn-ghost" type="button" data-cancel hidden>Cancel build</button>
            <a class="btn btn-primary" data-download hidden>Download</a>
          </div>
        </form>
        <p class="small muted voxel-install" data-install></p>
      </section>
    </div>
  </main>
  <script type="module" src="assets/js/voxel.js"></script>
</body>
</html>
